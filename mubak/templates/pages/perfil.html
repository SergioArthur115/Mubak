<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mubak - Meu Perfil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/mubak_icon.png') }}">
</head>
<body>
    {% include 'partials/header.html' %}

    <main>
        <section class="perfil_container">
            <nav class="perfil_menu">
                <div class="perfil_cabecalho" style="padding: 20px 40px; border-bottom: 1px solid rgba(10,35,50,0.15);">
                    <p style="font-size:18px; font-weight:bold; color:var(--cor-primaria);">
                        Olá, {{ user.nome }}
                    </p>
                    <p style="font-size:13px; color:var(--cor-primaria); opacity:0.7;">{{ user.email }}</p>
                </div>
                <ul>
                    <li class="perfil_menu_item">
                        <a href="{{ url_for('user.perfil_dados') }}">Meus Dados</a>
                    </li>
                    <li class="perfil_menu_item">
                        <a href="{{ url_for('user.perfil_pedidos') }}">Meus Pedidos</a>
                    </li>
                    <li class="perfil_menu_item">
                        <a href="{{ url_for('user.perfil_enderecos') }}">Meus Endereços</a>
                    </li>
                    <li class="perfil_menu_item">
                        <a href="{{ url_for('carrinho.carrinho') }}">Meu Carrinho</a>
                    </li>
                    <li class="perfil_menu_item sair">
                        <a href="{{ url_for('auth.logout') }}">Sair</a>
                    </li>
                </ul>
            </nav>
        </section>
    </main>

    {% include 'partials/footer.html' %}
    <script src="{{ url_for('static', filename='js/menu-ativo.js') }}"></script>
</body>
</html>
