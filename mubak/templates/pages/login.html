<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mubak - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/mubak_icon.png') }}">
</head>
<body>
    {% include 'partials/header.html' %}
    <main>
        <section class="login_container">
            <div class="login_box">
                <h2>Entrar na sua conta</h2>
                {% with msgs = get_flashed_messages() %}
                {% if msgs %}
                <ul class="flash_msgs erro">
                    {% for m in msgs %}<li>{{ m }}</li>{% endfor %}
                </ul>
                {% endif %}
                {% endwith %}
                <form class="login_form" method="POST" action="{{ url_for('auth.login') }}">
                    <div class="login_campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email"
                               placeholder="seu@email.com" autocomplete="username" required>
                    </div>
                    <div class="login_campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha"
                               placeholder="Digite sua senha" autocomplete="current-password" required>
                    </div>
                    <div class="login_acoes">
                        <button type="submit" class="btn_entrar">Entrar</button>
                        <a href="#" class="link_esqueci_senha">Esqueci minha senha</a>
                    </div>
                    <div class="login_cadastro">
                        <p>Não tem uma conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a></p>
                    </div>
                </form>
            </div>
        </section>
    </main>
    {% include 'partials/footer.html' %}
    <script src="{{ url_for('static', filename='js/menu-ativo.js') }}"></script>
</body>
</html>
